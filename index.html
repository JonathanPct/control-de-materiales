<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Materiales</title>
<style>
  :root{
    --bg-base:#14161A;
    --bg-panel:#1E2126;
    --bg-raised:#262A31;
    --bg-raised-2:#2E333B;
    --accent:#FFB020;
    --accent-dim:#8A5E12;
    --accent-soft:rgba(255,176,32,0.12);
    --success:#4CD98A;
    --success-soft:rgba(76,217,138,0.12);
    --danger:#FF5D5D;
    --danger-soft:rgba(255,93,93,0.12);
    --text-primary:#EDEEF0;
    --text-muted:#868D99;
    --text-faint:#565C66;
    --lcd-green:#39FF6A;
    --border:#33383F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:1180px;
    margin:0 auto;
    padding:18px;
    background:var(--bg-base);
    border-radius:14px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-weight:700;
    margin:0 0 4px 0;
  }
  h1{
    font-family:"Arial Black",Arial,sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    font-size:26px;
    margin:0 0 2px 0;
    color:var(--text-primary);
  }
  .subtitle{color:var(--text-muted);font-size:13px;margin:0 0 18px 0;}

  /* Segmented mode control */
  .mode-bar{
    display:flex;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:4px;
    gap:4px;
    margin-bottom:14px;
  }
  .mode-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-family:"Arial Black",Arial,sans-serif;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-size:13px;
    padding:12px 8px;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .mode-btn:hover{color:var(--text-primary);}
  .mode-btn.active{
    background:var(--accent);
    color:#1A1300;
  }

  /* Project bar */
  .project-bar{
    display:flex;
    gap:8px;
    align-items:center;
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .project-bar select, .project-bar input[type=text]{
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    padding:9px 10px;
    border-radius:7px;
    font-size:13px;
  }
  .project-bar select{flex:1; min-width:140px;}
  .project-bar input[type=text]{flex:1; min-width:140px;}
  .pill-current{
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    padding:6px 10px;
    border-radius:20px;
    white-space:nowrap;
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-muted);
    border:1px dashed var(--border);
    border-radius:10px;
    font-size:14px;
  }

  /* Scanner */
  .scanner-panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
  }
  .scanner-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  #scanInput{
    flex:1;
    min-width:200px;
    background:#0B1A0E;
    border:1px solid #1E4A2A;
    color:var(--lcd-green);
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:20px;
    letter-spacing:.05em;
    padding:14px 14px;
    border-radius:8px;
    caret-color:var(--lcd-green);
    outline:none;
  }
  #scanInput::placeholder{color:#1E4A2A;}
  #scanInput:focus{border-color:var(--lcd-green);box-shadow:0 0 0 3px rgba(57,255,106,0.12);}
  .qty-box{
    width:74px;
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    font-size:18px;
    text-align:center;
    border-radius:8px;
    padding:14px 4px;
  }
  .cam-btn{
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    border-radius:8px;
    padding:0 16px;
    font-size:13px;
    cursor:pointer;
    font-weight:600;
  }
  .cam-btn:hover{background:var(--bg-raised-2);}
  .scan-hint{color:var(--text-faint); font-size:11.5px; margin-top:8px;}

  .unknown-box{
    margin-top:10px;
    background:var(--danger-soft);
    border:1px solid var(--danger);
    border-radius:8px;
    padding:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
  }
  .unknown-box input{
    flex:1;
    min-width:160px;
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    padding:8px 10px;
    border-radius:6px;
  }

  /* Layout columns */
  .cols{display:flex; gap:14px; align-items:flex-start;}
  .col-main{flex:1.6; min-width:0;}
  .col-side{flex:1; min-width:240px;}

  /* Ticket feed */
  .ticket{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .ticket-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--border);
  }
  .ticket-title{
    font-family:"Arial Black",Arial,sans-serif;
    text-transform:uppercase;
    font-size:12px;
    letter-spacing:.08em;
    color:var(--text-muted);
  }
  .ticket-body{max-height:520px; overflow-y:auto;}
  .ticket-row{
    display:grid;
    grid-template-columns:1fr auto auto auto;
    gap:6px 10px;
    align-items:center;
    padding:12px 14px;
    border-bottom:1px dashed var(--border);
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
  }
  .ticket-row:last-child{border-bottom:none;}
  .row-main{grid-column:1/2;}
  .row-code{color:var(--accent); font-weight:700; font-size:13px;}
  .row-desc{color:var(--text-primary); font-size:13px; margin-top:2px; font-family:-apple-system,sans-serif;}
  .row-ts{color:var(--text-faint); font-size:11px; margin-top:2px;}
  .row-qty{
    color:var(--text-primary);
    font-weight:700;
    font-size:14px;
    background:var(--bg-raised);
    padding:4px 9px;
    border-radius:6px;
    white-space:nowrap;
  }
  .return-qty{
    width:46px;
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    text-align:center;
    border-radius:6px;
    padding:6px 2px;
    font-family:ui-monospace,monospace;
  }
  .btn-return{
    background:var(--danger-soft);
    border:1px solid var(--danger);
    color:var(--danger);
    font-family:-apple-system,sans-serif;
    font-size:11.5px;
    font-weight:700;
    padding:6px 9px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-return:hover{background:var(--danger); color:#1A0000;}

  .devuelto-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:6px 10px;
    padding:10px 14px;
    border-bottom:1px dashed var(--border);
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-size:12.5px;
    color:var(--text-muted);
  }
  .devuelto-row:last-child{border-bottom:none;}
  .tag-devuelto{
    color:var(--success);
    background:var(--success-soft);
    padding:2px 7px;
    border-radius:5px;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    white-space:nowrap;
  }

  /* Side panel */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
  }

  /* Stock view */
  .stock-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px dashed var(--border);
  }
  .stock-row:last-child{border-bottom:none;}
  .stock-row .row-code{font-size:13px;}
  .stock-row .row-desc{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
  .stock-qty{
    font-family:ui-monospace,"SF Mono",Consolas,monospace;
    font-weight:700;
    font-size:15px;
    padding:4px 10px;
    border-radius:6px;
    white-space:nowrap;
  }
  .stock-qty.ok{background:var(--success-soft); color:var(--success);}
  .stock-qty.low{background:var(--danger-soft); color:var(--danger);}

  .manual-stock-form{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .manual-stock-form input{
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    padding:9px 10px;
    border-radius:7px;
    font-size:13px;
  }
  .manual-stock-form input[name="mCode"]{flex:1; min-width:90px;}
  .manual-stock-form input[name="mDesc"]{flex:2; min-width:140px;}
  .manual-stock-form input[name="mQty"]{width:80px;}

  .movement-row{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:4px 10px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px dashed var(--border);
    font-size:12px;
  }
  .movement-row:last-child{border-bottom:none;}
  .movement-row .m-code{color:var(--accent); font-weight:700; font-family:ui-monospace,monospace;}
  .movement-row .m-desc{color:var(--text-muted); grid-column:1/3;}
  .movement-row .m-origin{color:var(--text-faint); font-size:11px; grid-column:1/3;}
  .tag-entrada, .tag-salida{
    padding:2px 7px;
    border-radius:5px;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    white-space:nowrap;
  }
  .tag-entrada{background:var(--success-soft); color:var(--success);}
  .tag-salida{background:var(--danger-soft); color:var(--danger);}

  .panel-title{
    font-family:"Arial Black",Arial,sans-serif;
    text-transform:uppercase;
    font-size:11.5px;
    letter-spacing:.07em;
    color:var(--text-muted);
    margin:0 0 10px 0;
  }
  .stat-row{display:flex; justify-content:space-between; padding:5px 0; font-size:13px;}
  .stat-row .num{font-weight:700; color:var(--accent); font-family:ui-monospace,monospace;}
  .btn{
    width:100%;
    background:var(--bg-raised);
    border:1px solid var(--border);
    color:var(--text-primary);
    font-size:13px;
    font-weight:600;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:8px;
  }
  .btn:hover{background:var(--bg-raised-2);}
  .btn.primary{background:var(--accent); color:#1A1300; border-color:var(--accent);}
  .btn.primary:hover{background:#FFC24D;}
  .btn.ghost-danger{color:var(--danger); border-color:var(--danger); background:transparent;}
  .btn.ghost-danger:hover{background:var(--danger-soft);}

  #camOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.85);
    display:none; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:12px;
  }
  #camOverlay video{width:min(90vw,420px); border-radius:10px; border:2px solid var(--accent);}
  #camOverlay .cam-status{color:var(--text-primary); font-size:13px;}

  .status-banner{
    font-size:12px;
    padding:8px 12px;
    border-radius:7px;
    margin-bottom:12px;
    background:var(--danger-soft);
    color:var(--danger);
    border:1px solid var(--danger);
    display:none;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--bg-raised-2); border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <p class="eyebrow">Almacén / Picking</p>
  <h1>Control de materiales</h1>
  <p class="subtitle">Escanea el código de barras generado desde Excel para registrar cada material.</p>

  <div id="statusBanner" class="status-banner"></div>

  <div class="mode-bar" id="modeBar"></div>
  <div id="projectBar"></div>
  <div id="scannerZone"></div>

  <div class="cols">
    <div class="col-main" id="mainList"></div>
    <div class="col-side" id="sidePanel"></div>
  </div>
</div>

<div id="camOverlay">
  <video id="camVideo" autoplay playsinline muted></video>
  <div class="cam-status" id="camStatus">Apunta al código de barras…</div>
  <button class="btn ghost-danger" style="width:auto;padding:8px 20px;" id="camClose">Cerrar cámara</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){

  // ---------- State ----------
  let state = {
    mode: 'almacen', // 'montaje' | 'almacen' | 'proyecto'
    currentProject: null,
    catalog: [],           // [{code, desc, qty}]  qty = stock actual
    movements: [],          // [{id, code, desc, qty, type:'entrada'|'salida', origin, ts}]
    lists: {
      montaje: {servido:[], devuelto:[]}
    },
    projects: [],           // ["Nombre proyecto", ...]
    projectData: {}         // { "Nombre": {servido:[], devuelto:[]} }
  };
  let pendingUnknownCode = null;
  let catalogSearchTerm = '';
  let listView = 'servido'; // 'servido' | 'devuelto' — which sub-list is shown in Montaje/Proyecto

  const $ = sel => document.querySelector(sel);
  const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const nowStr = () => new Date().toLocaleString('es-ES');
  const slug = s => s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');

  function showStatus(msg){
    const b = $('#statusBanner');
    b.textContent = msg;
    b.style.display = 'block';
    setTimeout(()=>{ b.style.display='none'; }, 4500);
  }

  // ---------- Storage ----------
  async function safeGet(key){
    try{
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function safeSet(key, value){
    try{
      const r = await window.storage.set(key, JSON.stringify(value), false);
      if(!r) showStatus('No se pudo guardar "'+key+'". Los datos podrían no persistir.');
      return r;
    }catch(e){
      showStatus('Error guardando "'+key+'": '+e.message);
      return null;
    }
  }

  async function loadAll(){
    const [catalog, movements, lists, projects, appState] = await Promise.all([
      safeGet('catalog'), safeGet('movements'), safeGet('lists'), safeGet('projects'), safeGet('app_state')
    ]);
    if(catalog) state.catalog = catalog.map(m => ({code:m.code, desc:m.desc, qty: typeof m.qty==='number'?m.qty:0}));
    if(movements) state.movements = movements;
    if(lists) state.lists.montaje = lists.montaje || {servido:[], devuelto:[]};
    if(projects) state.projects = projects.map(p => typeof p === 'string' ? {name:p, status:'activo'} : {name:p.name, status:p.status||'activo'});
    if(appState){
      state.mode = appState.mode || 'almacen';
      state.currentProject = appState.currentProject || null;
    }
    if(state.currentProject){
      const pd = await safeGet('project_'+slug(state.currentProject));
      state.projectData[state.currentProject] = pd || {servido:[], devuelto:[]};
    }
    render();
  }

  function saveAppState(){ safeSet('app_state', {mode:state.mode, currentProject:state.currentProject}); }
  function saveCatalog(){ safeSet('catalog', state.catalog); }
  function saveMovements(){ safeSet('movements', state.movements.slice(0,500)); }
  function saveLists(){ safeSet('lists', state.lists); }
  function saveProjects(){ safeSet('projects', state.projects); }
  function saveProjectData(name){ safeSet('project_'+slug(name), state.projectData[name]); }

  // ---------- Target resolution (Montaje / Proyecto only — Almacén is the stock view) ----------
  function currentTarget(){
    if(state.mode === 'montaje') return state.lists.montaje;
    if(state.mode === 'proyecto' && state.currentProject) return state.projectData[state.currentProject];
    return null;
  }
  function persistCurrentTarget(){
    if(state.mode === 'proyecto' && state.currentProject) saveProjectData(state.currentProject);
    else saveLists();
  }
  function originLabel(){
    if(state.mode === 'montaje') return 'Montaje';
    if(state.mode === 'proyecto') return 'Proyecto: '+(state.currentProject||'');
    return 'Almacén';
  }

  // ---------- Catalog / stock lookup ----------
  function findInCatalog(code){
    return state.catalog.find(m => m.code.toLowerCase() === code.toLowerCase());
  }

  // ---------- Stock ledger ----------
  function adjustStock(code, desc, qty, type, origin){
    let item = findInCatalog(code);
    if(!item){
      item = {code, desc, qty:0};
      state.catalog.push(item);
    }
    item.qty += (type === 'entrada' ? qty : -qty);
    state.movements.unshift({id:uid(), code, desc:item.desc, qty, type, origin, ts:nowStr()});
    saveCatalog();
    saveMovements();
  }

  // ---------- Add / Return ----------
  function addEntryToTarget(target, code, desc, qty){
    const existing = target.servido.find(e => e.code.toLowerCase() === code.toLowerCase());
    if(existing){
      existing.qty += qty;
      existing.ts = nowStr();
    }else{
      target.servido.unshift({id:uid(), code, desc, qty, ts:nowStr()});
    }
  }

  function handleScan(rawCode){
    const code = rawCode.trim();
    if(!code) return;
    const qty = Math.max(1, parseInt($('#qtyInput').value,10) || 1);

    if(state.mode === 'almacen'){
      const match = findInCatalog(code);
      if(match){
        adjustStock(match.code, match.desc, qty, 'entrada', 'Almacén (escaneo)');
        pendingUnknownCode = null;
        showStatus('Entrada registrada: +'+qty+' · '+match.code);
        render();
      }else{
        pendingUnknownCode = {code, qty, ctx:'almacen'};
        renderScannerZone();
      }
      $('#scanInput').value = '';
      $('#scanInput').focus();
      return;
    }

    const target = currentTarget();
    if(!target){ showStatus('Selecciona un proyecto antes de escanear.'); return; }
    if(state.mode==='proyecto'){
      const p = findProject(state.currentProject);
      if(p && p.status==='finalizado'){ showStatus('Este proyecto está finalizado. Reactívalo para seguir registrando material.'); return; }
    }
    const match = findInCatalog(code);
    if(match){
      addEntryToTarget(target, match.code, match.desc, qty);
      persistCurrentTarget();
      adjustStock(match.code, match.desc, qty, 'salida', originLabel());
      pendingUnknownCode = null;
      render();
    }else{
      pendingUnknownCode = {code, qty, ctx:'salida'};
      renderScannerZone();
    }
    $('#scanInput').value = '';
    $('#scanInput').focus();
  }

  function confirmUnknown(){
    if(!pendingUnknownCode) return;
    const descInput = $('#unknownDesc');
    const desc = (descInput.value || '').trim();
    if(!desc){ showStatus('Escribe una descripción para el material.'); return; }
    const {code, qty, ctx} = pendingUnknownCode;
    if(ctx === 'almacen'){
      state.catalog.push({code, desc, qty:0});
      adjustStock(code, desc, qty, 'entrada', 'Almacén (escaneo)');
    }else{
      state.catalog.push({code, desc, qty:0});
      const target = currentTarget();
      addEntryToTarget(target, code, desc, qty);
      persistCurrentTarget();
      adjustStock(code, desc, qty, 'salida', originLabel());
    }
    pendingUnknownCode = null;
    render();
    $('#scanInput').focus();
  }

  function returnEntry(id, qtyToReturn){
    const target = currentTarget();
    if(!target) return;
    const entry = target.servido.find(e => e.id === id);
    if(!entry) return;
    const q = Math.min(Math.max(1, qtyToReturn), entry.qty);
    entry.qty -= q;
    target.devuelto.unshift({code:entry.code, desc:entry.desc, qty:q, ts:nowStr()});
    if(entry.qty <= 0){
      target.servido = target.servido.filter(e => e.id !== id);
    }
    persistCurrentTarget();
    adjustStock(entry.code, entry.desc, q, 'entrada', originLabel()+' (devolución)');
    render();
  }

  function clearCurrentList(){
    const target = currentTarget();
    if(!target) return;
    if(!confirm('¿Vaciar esta lista (servidos y devueltos)? Esta acción no se puede deshacer. El stock no se modificará.')) return;
    target.servido = [];
    target.devuelto = [];
    persistCurrentTarget();
    render();
  }

  function addManualStock(code, desc, qty){
    code = code.trim();
    desc = desc.trim();
    qty = Math.max(1, parseInt(qty,10) || 0);
    if(!code || !desc || !qty){ showStatus('Rellena código, descripción y una cantidad válida.'); return; }
    const existing = findInCatalog(code);
    if(existing && !existing.desc) existing.desc = desc;
    adjustStock(code, desc, qty, 'entrada', 'Almacén (manual)');
    render();
  }

  // ---------- Projects ----------
  function findProject(name){
    return state.projects.find(p => p.name === name);
  }

  async function selectProject(name){
    state.currentProject = name || null;
    listView = 'servido';
    if(name){
      if(!state.projectData[name]){
        const pd = await safeGet('project_'+slug(name));
        state.projectData[name] = pd || {servido:[], devuelto:[]};
      }
    }
    saveAppState();
    render();
  }

  async function createProject(name){
    name = name.trim();
    if(!name) return;
    if(!findProject(name)){
      state.projects.push({name, status:'activo'});
      saveProjects();
    }
    if(!state.projectData[name]) state.projectData[name] = {servido:[], devuelto:[]};
    saveProjectData(name);
    await selectProject(name);
  }

  function toggleProjectStatus(name){
    const p = findProject(name);
    if(!p) return;
    p.status = p.status === 'finalizado' ? 'activo' : 'finalizado';
    saveProjects();
    render();
  }

  async function deleteProject(name){
    if(!confirm('¿Eliminar el proyecto "'+name+'" y todo su material registrado? Esta acción no se puede deshacer.')) return;
    state.projects = state.projects.filter(p => p.name !== name);
    delete state.projectData[name];
    saveProjects();
    try{ await window.storage.delete('project_'+slug(name), false); }catch(e){}
    if(state.currentProject === name){
      state.currentProject = null;
      saveAppState();
    }
    render();
  }

  // ---------- Cross-project export ----------
  async function loadAllProjectData(){
    for(const p of state.projects){
      if(!state.projectData[p.name]){
        const pd = await safeGet('project_'+slug(p.name));
        state.projectData[p.name] = pd || {servido:[], devuelto:[]};
      }
    }
  }

  async function exportAllProjects(){
    if(!state.projects.length){ showStatus('Todavía no hay proyectos creados.'); return; }
    await loadAllProjectData();
    const wb = XLSX.utils.book_new();
    const usedNames = new Set();
    const summary = [];
    state.projects.forEach(p => {
      const name = p.name;
      const pd = state.projectData[name] || {servido:[], devuelto:[]};
      const rows = [
        ...pd.servido.map(e => ({Código:e.code, Descripción:e.desc, Cantidad:e.qty, Fecha:e.ts, Estado:'Servido'})),
        ...pd.devuelto.map(e => ({Código:e.code, Descripción:e.desc, Cantidad:e.qty, Fecha:e.ts, Estado:'Devuelto'}))
      ];
      summary.push({
        Proyecto:name,
        'Unidades servidas': pd.servido.reduce((a,e)=>a+e.qty,0),
        'Unidades devueltas': pd.devuelto.reduce((a,e)=>a+e.qty,0)
      });
      let sheetName = name.slice(0,31).replace(/[\\/?*\[\]:]/g,' ');
      let base = sheetName, i = 2;
      while(usedNames.has(sheetName)){ sheetName = (base.slice(0,28)+'_'+i).slice(0,31); i++; }
      usedNames.add(sheetName);
      const ws = XLSX.utils.json_to_sheet(rows.length?rows:[{Código:'',Descripción:'',Cantidad:'',Fecha:'',Estado:''}]);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
    const wsSummary = XLSX.utils.json_to_sheet(summary);
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Resumen');
    // Move summary sheet to the front
    wb.SheetNames.unshift(wb.SheetNames.pop());
    XLSX.writeFile(wb, `historico_proyectos_${Date.now()}.xlsx`);
  }

  // ---------- Excel export ----------
  function exportList(target, filename){
    const wb = XLSX.utils.book_new();
    const servidoRows = target.servido.map(e => ({Código:e.code, Descripción:e.desc, Cantidad:e.qty, Fecha:e.ts}));
    const devueltoRows = target.devuelto.map(e => ({Código:e.code, Descripción:e.desc, Cantidad:e.qty, Fecha:e.ts}));
    const wsS = XLSX.utils.json_to_sheet(servidoRows.length?servidoRows:[{Código:'',Descripción:'',Cantidad:'',Fecha:''}]);
    const wsD = XLSX.utils.json_to_sheet(devueltoRows.length?devueltoRows:[{Código:'',Descripción:'',Cantidad:'',Fecha:''}]);
    XLSX.utils.book_append_sheet(wb, wsS, 'Servido');
    XLSX.utils.book_append_sheet(wb, wsD, 'Devuelto');
    XLSX.writeFile(wb, filename);
  }

  function importCatalogFile(file){
    const reader = new FileReader();
    reader.onload = function(ev){
      try{
        const wb = XLSX.read(ev.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        let added = 0, withStock = 0;
        rows.forEach(row => {
          const keys = Object.keys(row);
          const codeKey = keys.find(k => /^(c[oó]digo|code|codigo|sku)$/i.test(k.trim())) || keys[0];
          const descKey = keys.find(k => /^(descripci[oó]n|desc|material|nombre)$/i.test(k.trim())) || keys[1] || keys[0];
          const qtyKey = keys.find(k => /^(stock|cantidad|existencias)$/i.test(k.trim()));
          const code = String(row[codeKey]).trim();
          const desc = String(row[descKey]).trim();
          const qtyVal = qtyKey ? parseInt(row[qtyKey],10) : NaN;
          if(!code) return;
          let item = state.catalog.find(m => m.code.toLowerCase() === code.toLowerCase());
          if(item){
            if(desc) item.desc = desc;
          }else{
            item = {code, desc: desc || '(sin descripción)', qty:0};
            state.catalog.push(item);
            added++;
          }
          if(!isNaN(qtyVal) && qtyVal > 0){
            adjustStock(item.code, item.desc, qtyVal, 'entrada', 'Importación catálogo');
            withStock++;
          }
        });
        saveCatalog();
        showStatus('Catálogo actualizado: '+rows.length+' filas procesadas, '+added+' materiales nuevos'+(withStock?', '+withStock+' con entrada de stock':'')+'.');
        render();
      }catch(err){
        showStatus('No se pudo leer el archivo: '+err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // ---------- Camera scanning ----------
  let camStream = null;
  async function openCamera(){
    if(!('BarcodeDetector' in window)){
      showStatus('Tu navegador no soporta escaneo por cámara. Usa un lector USB/Bluetooth o introduce el código manualmente.');
      return;
    }
    const overlay = $('#camOverlay');
    const video = $('#camVideo');
    overlay.style.display = 'flex';
    try{
      camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      video.srcObject = camStream;
      const detector = new BarcodeDetector();
      const loop = async () => {
        if(!camStream) return;
        try{
          const codes = await detector.detect(video);
          if(codes && codes.length){
            closeCamera();
            handleScan(codes[0].rawValue);
            return;
          }
        }catch(e){}
        if(camStream) requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }catch(e){
      $('#camStatus').textContent = 'No se pudo acceder a la cámara: '+e.message;
    }
  }
  function closeCamera(){
    if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
    $('#camOverlay').style.display='none';
  }
  $('#camClose').addEventListener('click', closeCamera);

  function renderScannerZone(){
    const zone = $('#scannerZone');
    const currentProj = state.mode==='proyecto' && state.currentProject ? findProject(state.currentProject) : null;

    const placeholder = state.mode==='proyecto' && !state.currentProject ? 'Selecciona un proyecto para escanear…'

      : 'Escanea o introduce el código…';
    const hint = state.mode==='almacen'
      ? 'Cada código escaneado aquí suma unidades al stock (entrada). Para material desconocido, te pedirá una descripción.'
      : 'Cada código escaneado aquí resta unidades del stock (salida) y queda registrado en esta lista.';
    zone.innerHTML = `

    }
  }

  }

  function renderCatalogResults(){
    const box = $('#catalogResults');
    if(!box) return;
    const term = catalogSearchTerm.trim().toLowerCase();
    if(!term){ box.innerHTML = ''; return; }
    const matches = state.catalog.filter(m =>
      m.code.toLowerCase().includes(term) || m.desc.toLowerCase().includes(term)
    );
    if(!matches.length){
      box.innerHTML = '<div style="color:var(--text-faint); font-size:12.5px;">Sin coincidencias.</div>';
      return;
    }
    box.innerHTML = matches.slice(0,25).map(m => `
      <div style="display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed var(--border); font-size:12.5px;">
        <span class="row-code" style="font-size:12px;">${m.code}</span>
        <span style="color:var(--text-muted); text-align:right;">${m.desc} · <strong style="color:${m.qty>0?'var(--success)':'var(--danger)'};">${m.qty}</strong></span>
      </div>
    `).join('') + (matches.length>25 ? `<div style="color:var(--text-faint); font-size:11.5px; padding-top:4px;">+${matches.length-25} más…</div>` : '');
  }

  loadAll();
})();
</script>
</body>
</html>
